services:
  - type: web
    name: file2base-evaluator-demo
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 app:app
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: FILE2BASE_SECRET_KEY
        generateValue: true
      - key: FILE2BASE_WORKSPACE_TTL_SECONDS
        value: "21600"
      - key: PYTHON_VERSION
        value: "3.11.11"
